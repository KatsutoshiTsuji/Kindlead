name: Close Pull Requests

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  close-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Close and Comment
        uses: actions/github-script@v7
        with:
          script: |
            const message = `👋 こんにちは！Kindlead プロジェクトに関心をお寄せいただきありがとうございます。

            当リポジトリでは保守管理および品質方針（AI自動生成PRへの対策等を含む）に基づき、**外部からのプルリクエスト（PR）の受付を行っておりません**。
            
            不具合のご報告や機能改善のご提案がございましたら、お手数ですが **[Issues](${context.payload.repository.html_url}/issues)** へご投稿いただけますと幸いです。
            
            ご理解とご協力のほどよろしくお願いいたします。`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: message
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed'
            });
